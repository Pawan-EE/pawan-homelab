<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title description">
  <title id="title">Pawan HomeLab — conceptual service architecture</title>
  <desc id="description">Three access paths: private administration through Tailscale to Cockpit, Dockge, and SSH; trusted LAN file access through Samba to NAS storage; and browser access through Cloudflare. Public portfolio traffic and Access-protected Homepage and FileBrowser traffic use matched Cloudflare Tunnel routes. Only Samba and FileBrowser connect to NAS storage in this diagram. This is a conceptual view, not a verified network or mount inventory.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#61728a"/></marker>
    <marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#087f8c"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#152b46}
      .title{font-size:32px;font-weight:700;letter-spacing:-.5px}
      .subtitle{font-size:17px;fill:#52657d}
      .label{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#087f8c}
      .node{fill:#fff;stroke:#d5dfe8;stroke-width:1.5}
      .accent{fill:#e8f5f4;stroke:#93ccca;stroke-width:1.5}
      .heading{font-size:18px;font-weight:700}
      .small{font-size:14px;fill:#52657d}
      .line{fill:none;stroke:#61728a;stroke-width:2;marker-end:url(#arrow)}
      .data{fill:none;stroke:#087f8c;stroke-width:2.5;marker-end:url(#tealArrow)}
      .route{font-size:12px;font-weight:700;fill:#52657d}
    </style>
  </defs>
  <rect width="1280" height="860" fill="#f4f7fa"/>
  <rect x="36" y="34" width="7" height="57" rx="3" fill="#087f8c"/>
  <text x="59" y="59" class="title">One host. Three access paths.</text>
  <text x="59" y="88" class="subtitle">Pawan HomeLab · Ubuntu NAS and self-hosted applications</text>
  <rect x="1019" y="39" width="221" height="33" rx="16" fill="#e2eeef"/>
  <text x="1037" y="60" class="label">CONCEPTUAL VIEW</text>

  <rect x="35" y="118" width="1210" height="153" rx="16" fill="#fff"/>
  <text x="57" y="146" class="label">01 / PRIVATE ADMINISTRATION</text>
  <rect x="57" y="166" width="178" height="76" rx="11" class="node"/>
  <text x="77" y="196" class="heading">Administrator</text>
  <text x="77" y="219" class="small">Authorized device</text>
  <path d="M235 204H284" class="line"/>
  <rect x="294" y="166" width="184" height="76" rx="11" class="accent"/>
  <text x="314" y="196" class="heading">Tailscale</text>
  <text x="314" y="219" class="small">Private access path</text>
  <path d="M478 204H532" class="line"/>
  <rect x="542" y="166" width="388" height="76" rx="11" fill="#152b46"/>
  <text x="562" y="196" class="heading" style="fill:#fff">Cockpit · Dockge · SSH</text>
  <text x="562" y="219" class="small" style="fill:#d7e3ef">Host, container, and recovery administration</text>
  <text x="963" y="193" class="small">Management interfaces</text>
  <text x="963" y="216" class="small">stay on the private path.</text>

  <rect x="35" y="286" width="1210" height="144" rx="16" fill="#fff"/>
  <text x="57" y="314" class="label">02 / TRUSTED NETWORK FILE ACCESS</text>
  <rect x="57" y="334" width="178" height="67" rx="11" class="node"/>
  <text x="77" y="363" class="heading">LAN client</text>
  <text x="77" y="385" class="small">Authorized file user</text>
  <path d="M235 367H284" class="line"/>
  <rect x="294" y="334" width="184" height="67" rx="11" class="node"/>
  <text x="314" y="363" class="heading">Samba</text>
  <text x="314" y="385" class="small">Network file share</text>
  <path d="M478 367H1212V744H1150" class="data"/>
  <text x="543" y="356" class="small">Filesystem permissions govern access to shared files</text>

  <rect x="35" y="446" width="1161" height="253" rx="16" fill="#fff"/>
  <text x="57" y="475" class="label">03 / BROWSER APPLICATION ACCESS</text>
  <rect x="57" y="532" width="156" height="77" rx="11" class="node"/>
  <text x="76" y="563" class="heading">Browser</text>
  <text x="76" y="586" class="small">Web visitor</text>
  <path d="M213 571H245" class="line"/>
  <rect x="255" y="532" width="169" height="77" rx="11" class="node"/>
  <text x="274" y="563" class="heading">Cloudflare</text>
  <text x="274" y="586" class="small">Edge and routing</text>

  <path d="M424 551H447V517H649" class="line"/>
  <text x="475" y="505" class="route">PUBLIC ROUTE</text>
  <rect x="660" y="490" width="167" height="57" rx="10" class="node"/>
  <text x="679" y="524" class="heading">Tunnel route</text>
  <path d="M827 518H859" class="line"/>
  <rect x="870" y="490" width="303" height="57" rx="10" class="node"/>
  <text x="890" y="524" class="heading">Portfolio website</text>

  <path d="M424 591H447V621H468" class="line"/>
  <rect x="479" y="581" width="151" height="80" rx="10" class="accent"/>
  <text x="495" y="611" class="heading">Access</text>
  <text x="495" y="634" class="small">Identity check</text>
  <path d="M630 621H649" class="line"/>
  <rect x="660" y="581" width="167" height="80" rx="10" class="node"/>
  <text x="677" y="611" class="heading">Tunnel route</text>
  <text x="677" y="634" class="small">Protected apps</text>
  <path d="M827 621H846V590H860" class="line"/>
  <path d="M846 621V657H860" class="line"/>
  <rect x="870" y="566" width="303" height="49" rx="10" class="node"/>
  <text x="890" y="597" class="heading">Homepage dashboard</text>
  <rect x="870" y="632" width="303" height="49" rx="10" class="accent"/>
  <text x="890" y="663" class="heading">FileBrowser Quantum</text>

  <rect x="870" y="718" width="270" height="67" rx="11" fill="#087f8c"/>
  <path d="M1005 681V708" class="data"/>
  <text x="891" y="747" class="heading" style="fill:#fff">NAS storage</text>
  <text x="891" y="770" class="small" style="fill:#dff6f4">Samba + FileBrowser access</text>
  <text x="57" y="731" class="small">Tunnel boxes show two route views of the same tunnel concept.</text>
  <text x="57" y="754" class="small">Access authentication and application permissions are separate controls.</text>
  <text x="57" y="777" class="small">Arrows show logical request or file access, not tunnel connection direction.</text>
  <line x1="36" y1="808" x2="1244" y2="808" stroke="#d5dfe8"/>
  <text x="48" y="836" class="small">Conceptual service roles · No real endpoints · No claim of verified firewall rules or storage mounts</text>
</svg>
